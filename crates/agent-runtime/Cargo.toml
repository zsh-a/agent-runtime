[package]
name = "agent-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
agent-core.workspace = true
async-trait.workspace = true
blake3.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
agent-store = { workspace = true, features = ["sqlite"] }
tempfile.workspace = true

# The process hook shells out to a local binary, so its tokio features are
# native-only; declaring them here keeps mio out of wasm builds.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
